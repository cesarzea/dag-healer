name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The DAGs are written to run on both. If one of these breaks, the
          # guarded imports in dags/ are the place to look.
          - python: "3.13"
            airflow: "3.3.2"
          - python: "3.11"
            airflow: "2.11.0"

    name: python ${{ matrix.python }} / airflow ${{ matrix.airflow }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "apache-airflow==${{ matrix.airflow }}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-${{ matrix.python }}.txt"
          pip install "typing-extensions>=4.15.0"

      - name: Test
        env:
          PYTHONPATH: src:.
          AIRFLOW_HOME: ${{ github.workspace }}/.airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest -q
