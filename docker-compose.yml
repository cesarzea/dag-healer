# Airflow plus a fake upstream, for looking at the loop in a UI.
#
# The repair DAG diagnoses with Claude Code inside the Airflow container. It
# needs a token from `claude setup-token` in .env as CLAUDE_CODE_OAUTH_TOKEN.
# Git ignores .env, so the token never enters the repository.
services:
  api:
    build:
      context: .
      dockerfile: fake_shop_api/Dockerfile
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8099/health').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow:
    build: docker/airflow
    depends_on:
      api:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: /opt/airflow/repo/src
      SHOP_API_URL: http://api:8099
      # Optional here so `docker compose up api`, which the host demo uses,
      # still works without a token. Without one, diagnosis in Airflow fails.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Open the UI with no login. `airflow standalone` otherwise creates an
      # `admin` user with a random password written to a file inside the
      # container, which is a poor first five minutes for anyone who just
      # cloned this. The _AIRFLOW_WWW_USER_* variables that used to be here did
      # nothing: they belong to the official compose file's init service, not to
      # standalone. This is a throwaway demo container on localhost; do not
      # copy this line into anything real.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    volumes:
      - .:/opt/airflow/repo
    ports:
      - "127.0.0.1:8080:8080"
    command: bash -c "airflow db migrate && airflow standalone"
